version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: telecom_db
    ports: ["5432:5432"]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    # Pre-pull models on startup
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:7b && ollama pull nomic-embed-text && wait"]

  langfuse:
    image: langfuse/langfuse:2
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/langfuse_db
      NEXTAUTH_SECRET: mysecret
      NEXTAUTH_URL: http://localhost:3000
      SALT: mysalt
      LANGFUSE_INIT_ORG_ID: telecom-org
      LANGFUSE_INIT_PROJECT_ID: telecom-poc
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-e905abba-a6ae-4906-98a1-29039049ebd8
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-beec9cea-6e11-44cd-88b0-d6e44272ff7f
      LANGFUSE_INIT_USER_EMAIL: admin@telecom.com
      LANGFUSE_INIT_USER_PASSWORD: password

  backend:
    build: ./backend
    ports: ["8000:8000"]
    depends_on: [postgres, ollama, langfuse]
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:password@postgres:5432/telecom_db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_HOST=http://ollama:11434
      - LANGFUSE_PUBLIC_KEY=pk-lf-e905abba-a6ae-4906-98a1-29039049ebd8
      - LANGFUSE_SECRET_KEY=sk-lf-beec9cea-6e11-44cd-88b0-d6e44272ff7f
      - LANGFUSE_HOST=http://langfuse:3000

  frontend:
    build: ./frontend
    ports: ["3001:3001"]
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on: [backend]

volumes:
  pgdata:
  ollama_data: